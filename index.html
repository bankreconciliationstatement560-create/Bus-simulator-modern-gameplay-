<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bus Simulator</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:system-ui}
</style>
</head>
<body>
<div id="hud" style="
position:fixed;top:10px;left:10px;z-index:10;
background:rgba(0,0,0,.5);color:#fff;
padding:10px 12px;border-radius:12px;
font-weight:700;line-height:1.4;">
Speed: <span id="spd">0</span><br>
Coins: <span id="coins">0</span><br>
Steer: <span id="steerMode">TILT</span>
</div>
 <div id="controls" style="
position:fixed;bottom:12px;left:10px;right:10px;
display:flex;gap:10px;z-index:10;">
<div id="leftBtn"  style="flex:1;background:#333;color:#fff;border-radius:14px;text-align:center;line-height:60px;">⬅️</div>
<div id="accelBtn" style="flex:1;background:#16a34a;color:#fff;border-radius:14px;text-align:center;line-height:60px;">ACCEL</div>
<div id="brakeBtn" style="flex:1;background:#dc2626;color:#fff;border-radius:14px;text-align:center;line-height:60px;">BRAKE</div>
<div id="rightBtn" style="flex:1;background:#333;color:#fff;border-radius:14px;text-align:center;line-height:60px;">➡️</div>
 </div> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const light=new THREE.AmbientLight(0xffffff,0.9);
scene.add(light);

const groundGeo=new THREE.PlaneGeometry(5000,500);
const groundMat=new THREE.MeshBasicMaterial({color:0x2fbf5b});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;
scene.add(ground);
ground.material.color.set(0x222222);

const laneGeo = new THREE.PlaneGeometry(5000, 0.15);
const laneMat = new THREE.MeshBasicMaterial({color:0xffffff});

for(let i=-2;i<=2;i++){
  const lane=new THREE.Mesh(laneGeo,laneMat);
  lane.rotation.x=-Math.PI/2;
  lane.position.z=i*4;
  scene.add(lane);
}
 
const bus=new THREE.Group();
const cars=[];
for(let i=0;i<5;i++){
  const c=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1,3),
    new THREE.MeshBasicMaterial({color:0x3399ff})
  );
  c.position.set((Math.random()*6-3),1,-i*20);
  scene.add(c);
  cars.push(c);
}
const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,1.2,6),
  new THREE.MeshBasicMaterial({color:0xff4444})
);
body.position.y=1;
bus.add(body);

const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,1,2),
  new THREE.MeshBasicMaterial({color:0xdddddd})
);
cabin.position.set(0,1.5,-1.5);
bus.add(cabin);

scene.add(bus);
camera.position.set(6,4,10);
camera.lookAt(bus.position);
let speed=0;
let targetSpeed = 0;
let steer = 0;
let targetSteer = 0;
 window.addEventListener("deviceorientation", e=>{
  if(e.gamma===null) return;
  targetSteer = THREE.MathUtils.clamp(e.gamma/45, -0.4, 0.4);
  document.getElementById("steerMode").innerText="TILT";
});
accelBtn.onpointerdown = ()=> targetSpeed = 0.12;
brakeBtn.onpointerdown = ()=> targetSpeed = -0.08;
accelBtn.onpointerup = brakeBtn.onpointerup = ()=> targetSpeed = 0;
leftBtn.onpointerdown  = ()=> targetSteer = 0.04;
rightBtn.onpointerdown = ()=> targetSteer = -0.04;

leftBtn.onpointerup = rightBtn.onpointerup = ()=> targetSteer = 0; 
function animate(){
  requestAnimationFrame(animate);
  bus.rotation.y+=0.002;
 steer += (targetSteer - steer) * 0.15;
bus.rotation.y += steer;
 bus.rotation.y = Math.max(-0.6, Math.min(0.6, bus.rotation.y));
    speed += (targetSpeed - speed) * 0.08;
bus.position.z -= speed;
cars.forEach(c=>{
  c.position.z += speed*0.8;
  if(c.position.z>10) c.position.z=-100;
});
document.getElementById("spd").innerText = Math.abs(speed*800).toFixed(0);
// Camera follow (smooth)
const camOffset = new THREE.Vector3(6, 4, 10);
const desiredCamPos = bus.position.clone().add(camOffset);
camera.position.lerp(desiredCamPos, 0.05);
camera.lookAt(bus.position);    
let inside = false;

document.body.ondblclick = () => {
  inside = !inside;
  if (inside) {
    camera.position.set(0, 2, 1);   // interior view
  } else {
    camera.position.set(6, 4, 10);  // outside view
  }
}; 

 
  renderer.render(scene,camera);
}
animate();

  
  
   </script>

  
</body>
